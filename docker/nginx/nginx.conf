# nginx 主配置（alpine 官方镜像布局）
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    # 官方表中没有 flac/wav/opus/aac/ape 等音频后缀，必须补，否则会落到 default_type
    # ⚠️ 补充表【只写官方表没有的扩展名】：同名扩展后写的确实会覆盖先写的，但 nginx
    #    会为此打一条 [warn] duplicate extension（每次启动都刷），构建期静态自检也会
    #    直接失败 —— 见 docker/web/Dockerfile Stage 3。
    include       /etc/nginx/mime.types.audio;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;

    keepalive_timeout       65;
    keepalive_requests      1000;
    client_max_body_size    0;      # 上传大小由后端控制
    client_body_timeout     300s;
    reset_timedout_connection on;

    # 音频文件本身不要 gzip，只压文本类
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/manifest+json application/x-web-app-manifest+json
        image/svg+xml application/vnd.ms-fontobject font/woff2;

    # 临时目录写到 /var/cache/nginx（alpine 镜像默认在只读或无权限路径之外）
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    client_body_temp_path /var/cache/nginx/client_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}

