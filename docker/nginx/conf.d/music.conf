upstream musicbase_api {
    # "api" 是 docker-compose.yml 里 services.api 的服务名，不是 IP、也不是容器名。
    #   * Docker 内嵌 DNS（容器内 127.0.0.11）会把 service 名解析成该容器的地址，
    #     并自动处理容器重建后的 IP 变化——前提是这个查询发生在【容器运行期间】。
    #   * 但 nginx 对 upstream 里的主机名只在【自己启动时解析一次】并长期缓存结果，
    #     所以仅靠 DNS 是不够的：compose 里已给 api 钉了静态 IP 兜底（见 networks 说明）。
    #   * 绝不能写 0.0.0.0：那是【监听】语义（本机所有网卡），不是【连接】语义。
    #     nginx connect("0.0.0.0:8000") 等于连本机回环，而 nginx 容器里没人听 8000 -> 502。
    #   * 8000 是容器端口（compose 没有把它映射到宿主机），只在 musicbase-net 内可见。
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# WebSocket / SSE 支持
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 字符集：中文音乐名/艺人名的 Range 与 Content-Disposition 依赖它
    charset utf-8;

    # ------------------------------------------------------------------
    # 根路径 = musicplayer (PWA)
    # ------------------------------------------------------------------
    root /usr/share/nginx/html/player;
    index index.html;

    # 上传全部交给后端，nginx 侧不要卡 body
    client_max_body_size 0;
    client_body_timeout 300s;
    sendfile on;
    sendfile_max_chunk 4m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- PWA：worker / manifest 必须不缓存 ----------
    location ~* ^/(sw\.js|service-worker\.js|workbox-[^/]*\.js|manifest\.webmanifest)$
    {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    # ---------- 带 hash 的静态资源：长缓存 ----------
    location ~* ^/(assets|_app)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------- 后台管理 musicman => /admin/ ----------
    location ^~ /admin/ {
        alias /usr/share/nginx/html/man/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }
    # SPA 内部路由也可能拉取根级资源（vite base=/admin/ 时一般已带前缀，
    # 这里兜住旧版本产出的 /admin/assets/*）
    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/man/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ------------------------------------------------------------------
    # API：WebSocket / SSE / 大响应流式透传
    # 假设 FastAPI 路由挂载在根路径（不带 /api 前缀）。
    # 若 FastAPI 保持 root_path=/api，则改为 proxy_pass http://musicbase_api;（不带尾斜杠）
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://musicbase_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE / 扫描进度推送：必须关掉缓冲，否则前端收不到增量事件
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;   # SSE 用；普通 API 不受影响
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 文件/proxy 请求不设限；超时按扫描任务时长放宽
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;
    }

    # ------------------------------------------------------------------
    # 媒体与 artwork：
    #   标 internal -> 外部无法直连，必须由后端返回 X-Accel-Redirect 放行，
    #   这样鉴权、限速、URL 有效期都由 FastAPI 控制。
    #   Range（断点续传 / PWA 边下边播）由 nginx 静态处理天然支持。
    # ------------------------------------------------------------------
    # ⚠️ 这个 location 的前缀必须与后端的 MUSIC_STATIC_PREFIX 完全一致。
    #    stream.py 拼的是 inner = MUSIC_STATIC_PREFIX + quote(track.path)，
    #    而 track.path 是【相对音乐库】的路径（如 Artist/Album/a.flac），
    #    所以后端必须设 MUSIC_STATIC_PREFIX=/media/（含结尾斜杠），
    #    才能拼出 /media/Artist/Album/a.flac 并被这里的 alias 映射到 /music/ 下。
    #    后端默认值是 /music（对应它原生部署的 nginx 配置），容器里必须覆盖。
    location ^~ /media/ {
        internal;
        alias /music/;
        add_header Accept-Ranges bytes always;
        # ⚠️ nosniff 意味着浏览器不会做 MIME 嗅探、完全信任我们给的 Content-Type。
        #    所以 http 层必须 include mime.types.audio 补上 flac/wav 等后缀，
        #    否则这些文件会被判成下面的 default_type 而彻底无法播放。
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
        # 兜底：认不出来的后缀（cue/log/jpg 封面原图等）按二进制处理
        default_type application/octet-stream;
        # 注意：别在这里写 `types {}`，那会清空本 location 的整张类型表，
        #       连 mp3 都会退化成 octet-stream。
        # 无损文件单曲几十 MB，前 16MB 不限速保证起播不卡
        limit_rate_after 16m;
        limit_rate       2m;         # 之后限速 2MB/s，按带宽调整或删除这两行
    }

    # 路径规则：后端 ARTWORK_DIR = MEDIA_ROOT/artwork，而 MEDIA_ROOT=/var/lib/musicbase/media，
    # 所以这里必须指向 media/artwork 子目录，不能再写成 /var/lib/musicbase/artwork ——
    # 那是 MEDIA_ROOT 本身，早前版本把它当成了 artwork 目录（配置错误，已修正）。
    location ^~ /artwork/ {
        internal;
        alias /var/lib/musicbase/media/artwork/;
        expires 30d;
        # 不设 default_type：artwork 缓存文件名必须带真实扩展名(.webp/.jpg/.png/.avif)，
        # 否则同一目录里混 webp 和 jpg 时会被误判成同一种类型。
        add_header X-Content-Type-Options nosniff always;
    }

    # ------------------------------------------------------------------
    # 根路径兜底：SPA 前端路由（必须放最后）
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏不想被直接访问的前缀
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 注意：不要设置全局 error_page 404 /index.html，
    #      SPA 的路由兜底已由 try_files 完成，避免污染 /api 的 404 响应体。
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

