upstream musicbase_api {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# WebSocket / SSE 支持
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 字符集：中文音乐名/艺人名的 Range 与 Content-Disposition 依赖它
    charset utf-8;

    # ------------------------------------------------------------------
    # 根路径 = musicplayer (PWA)
    # ------------------------------------------------------------------
    root /usr/share/nginx/html/player;
    index index.html;

    # 上传全部交给后端，nginx 侧不要卡 body
    client_max_body_size 0;
    client_body_timeout 300s;
    sendfile on;
    sendfile_max_chunk 4m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- PWA：worker / manifest 必须不缓存 ----------
    location ~* ^/(sw\.js|service-worker\.js|workbox-[^/]*\.js|manifest\.webmanifest)$
    {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    # ---------- 带 hash 的静态资源：长缓存 ----------
    location ~* ^/(assets|_app)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------- 后台管理 musicman => /admin/ ----------
    location ^~ /admin/ {
        alias /usr/share/nginx/html/man/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }

    # 兜住旧版本产出的 /admin/assets/*）
    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/man/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ------------------------------------------------------------------
    # API：WebSocket / SSE / 大响应流式透传
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://musicbase_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE / 扫描进度推送：必须关掉缓冲，否则前端收不到增量事件
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;   # SSE 用；普通 API 不受影响
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 文件/proxy 请求不设限；超时按扫描任务时长放宽
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;
    }

    # ------------------------------------------------------------------
    # 音频（internal）：/music/
    # ------------------------------------------------------------------
    location ^~ /music/ {
        internal;
        alias /music/;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
        default_type application/octet-stream;
        limit_rate_after 16m;
        limit_rate       2m;         # 之后限速 2MB/s，按带宽调整或删除这两行
    }

    location ^~ /artwork/ {
        internal;
        alias /var/lib/musicbase/media/artwork/;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
    }

    # ------------------------------------------------------------------
    # 封面（公开静态）：/media/{artists,albums,tracks,playlists}/<file>
    # ------------------------------------------------------------------
    location ^~ /media/ {
        alias /var/lib/musicbase/media/artwork/;
        expires 30d;
        # 不设 default_type：同 /artwork/ 的理由，让后缀决定类型（jpg/webp/png/avif）
        add_header X-Content-Type-Options nosniff always;
    }

    # ------------------------------------------------------------------
    # 根路径兜底：SPA 前端路由（必须放最后）
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

