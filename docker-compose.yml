# wmusic-suite 一体化部署栈
# ---------------------------------------------------------------------------
# 三个子项目各自保留 git 仓库（以 submodule 挂载到本仓库根目录），
# 本文件负责把它们编排成一个服务栈：postgres + FastAPI + nginx(双前端)
# 用法：
#   cp .env.example .env && vim .env
#   docker compose build
#   docker compose up -d
# ---------------------------------------------------------------------------

name: wmusic

services:

  # ---------------------------- PostgreSQL -------------------------------
  db:
    image: postgres:17-alpine
    container_name: musicbase-db
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-musicbase}"
      POSTGRES_USER: "${POSTGRES_USER:-musicbase}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: "${TZ:-Asia/Shanghai}"
      LANG: C.UTF-8
      # 中文排序：如需按拼音排序可用 zh_CN.UTF-8，但注意体积与 ICU 版本
      # POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=zh-CN"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 固定 IP：数据库连接串里写的是服务名 db，固定后可避免重建容器时连接串解析漂移
    networks:
      musicbase:
        ipv4_address: ${DB_IPV4:-172.28.0.11}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicbase} -d ${POSTGRES_DB:-musicbase}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------- FastAPI 后端 musicbase -----------------------
  api:
    build: &api-build
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        PYTHON_VERSION: "3.13"
        INSTALL_FFMPEG: "${INSTALL_FFMPEG:-false}"
        FPCALC_VERSION: "${FPCALC_VERSION:-1.6.1}"
        # 连不上 GitHub 时填加速前缀，例如 https://ghfast.top/https://github.com
        FPCALC_MIRROR: "${FPCALC_MIRROR:-}"
    image: musicbase/api:${IMAGE_TAG:-latest}
    container_name: musicbase-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: &api-env-file
      - path: musicbase/.env
        format: raw
    environment: &api-env
      MUSIC_LIBRARY_PATH: /music
      MEDIA_ROOT: /var/lib/musicbase/media
      LOG_DIR: /var/lib/musicbase/logs          # 默认是 /app/logs，容器重建即丢
      # 必须绝对路径 + 落在持久化卷，否则容器重建后网易云登录态丢失
      NETEASE_COOKIES_FILE: /var/lib/musicbase/media/netease_cookies.json
      MUSIC_STATIC_PREFIX: /music/
      # ---- 服务发现与监听 ----
      HOST: "0.0.0.0"                           # 容器内监听所有网卡（对外端口由 web 的 ports 决定）
      PORT: "8000"                              # 必须与 Dockerfile CMD 的 --port 一致
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${POSTGRES_USER:-musicbase}"    # 复用 db 服务的凭据，避免填两遍
      DB_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}"
      DB_NAME: "${POSTGRES_DB:-musicbase}"
      TZ: "${TZ:-Asia/Shanghai}"
      PUID: "${PUID:-1000}"                     # 必须等于宿主机音乐库目录的属主
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-022}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      WAIT_FOR_DB: "${WAIT_FOR_DB:-true}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
      CHOWN_LIBRARY: "${CHOWN_LIBRARY:-false}"
    # 锚点：watcher 服务用 *api-volumes 复用（它同样要读写音乐库和 MEDIA_ROOT）
    volumes: &api-volumes
      # 音乐库：宿主机目录 -> /music（可写，因为要做标签编辑、文件整理、归档入库）
      - "${MUSIC_DIR:?请在 .env 中设置 MUSIC_DIR}:/music"
      # 媒体根：artwork / uploads/temp / uploads/staging 都在它下面。
      # ⚠️ 必须与 MUSIC_DIR 落在【同一物理卷】
      - "${MEDIA_DIR:?请在 .env 中设置 MEDIA_DIR}:/var/lib/musicbase/media"
      - app_data:/var/lib/musicbase/logs
    # 固定 IP
    networks:
      musicbase:
        ipv4_address: ${API_IPV4:-172.28.0.10}
    logging: *default-logging

  # --------------- 音乐库文件监控（watcher，独立进程，复用 api 镜像）---------
  watcher:
    build: *api-build
    image: musicbase/api:${IMAGE_TAG:-latest}
    container_name: musicbase-watcher
    restart: unless-stopped
    # 留足时间避免正在处理的文件被半途掐断
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "app.background.watcher"]
    env_file: *api-env-file
    environment:
      # 与 api 复用同一份配置：watcher 读的是同一套 Settings、同一个数据库、
      # 同一个音乐库和 MEDIA_ROOT，任何一项不一致都会导致两边看到的库不一样
      <<: *api-env
      RUN_MIGRATIONS: "false"
      LOG_DIR: /var/lib/musicbase/logs/watcher
      WATCH_MODE: "${WATCH_MODE:-polling}"
    healthcheck:
      disable: true
    volumes: *api-volumes
    networks:
      - musicbase
    logging: *default-logging

  # ------------------- nginx：双前端静态 + API 反代 + 媒体分发 -------------
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NODE_VERSION: "22"
        NGINX_VERSION: "1.27"
        PLAYER_BASE: "/"
        MAN_BASE: "/admin/"
    image: musicbase/web:${IMAGE_TAG:-latest}
    container_name: musicbase-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - "${MUSIC_DIR:?请在 .env 中设置 MUSIC_DIR}:/music:ro"
      - "${MEDIA_DIR:?请在 .env 中设置 MEDIA_DIR}:/var/lib/musicbase/media:ro"
    networks:
      - musicbase
    logging: *default-logging

# ---------------------------------------------------------------------------
# 自定义 bridge 网络 + 静态 IPAM
# ---------------------------------------------------------------------------
networks:
  musicbase:
    name: musicbase-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${MUSICBASE_SUBNET:-172.28.0.0/16}"

volumes:
  pgdata:
  app_data:      # 后端日志（LOG_DIR）

