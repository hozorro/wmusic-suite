# 开发模式覆盖层：api 换 uvicorn --reload + 源码挂载；前端不再进 nginx，
# 直接用 vite dev server（player 5173 / man 5174），自己代理 /api。
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   make dev
#
# 注意：dev 模式下 nginx 不再对外提供 8080（避免与构建产物混淆），
#       请访问 http://localhost:5173/ 与 http://localhost:5174/

services:
  api:
    build:
      args:
        INSTALL_FFMPEG: "true"
    # 只写「后端 Settings 或 entrypoint 真正会读」的键。
    # 别照抄通用直觉写 ENVIRONMENT / LOG_LEVEL / SQL_ECHO / WATCH_MODE ——
    # 后端 .env.example 里没有这些字段，配了也不会生效（详见 DEVDOC.md §5.7）。
    environment:
      DEBUG: "true"            # 后端 Settings 有此字段
      RUN_MIGRATIONS: "true"   # entrypoint.sh 消费
    command:
      ["uvicorn", "musicbase.main:app",
       "--host", "0.0.0.0", "--port", "8000", "--reload",
       "--reload-dir", "/app", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports:
      - "8000:8000"
    volumes:
      - ./musicbase:/app

  player-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable pnpm 2>/dev/null; if [ -f package-lock.json ]; then npm ci; elif [ -f pnpm-lock.yaml ]; then pnpm i --frozen-lockfile; else npm i; fi; npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./musicplayer:/app
      - /app/node_modules
    networks:
      - musicbase

  man-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable pnpm 2>/dev/null; if [ -f package-lock.json ]; then npm ci; elif [ -f pnpm-lock.yaml ]; then pnpm i --frozen-lockfile; else npm i; fi; npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_API_BASE: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ./musicman:/app
      - /app/node_modules
    networks:
      - musicbase

  web:
    ports: []
    profiles: ["web"]

